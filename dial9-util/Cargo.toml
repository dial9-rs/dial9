[package]
name = "dial9-util"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Axum instrumentation utilities for dial9-tokio-telemetry"
keywords = ["tokio", "telemetry", "tracing", "axum"]
categories = ["asynchronous", "development-tools::profiling"]

[dependencies]
dial9-tokio-telemetry = { version = "0.5.0-rc0", path = "../dial9-tokio-telemetry" }
dial9-trace-format = { workspace = true }
axum-0-7 = { package = "axum", version = "0.7", optional = true }
axum-core-0-4 = { package = "axum-core", version = "0.4", optional = true }
axum-0-8 = { package = "axum", version = "0.8", optional = true }
axum-core-0-5 = { package = "axum-core", version = "0.5", optional = true }
futures-util = { version = "0.3", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
], optional = true }
tokio = { version = "1.52.0", features = ["net", "sync"], optional = true }
tower = { version = "0.5", optional = true }
tower-service = { version = "0.3", optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
## A traced replacement for `axum::serve` from Axum 0.7.
axum-0-7 = [
    "dep:axum-0-7",
    "dep:axum-core-0-4",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tower",
    "dep:tower-service",
    "dep:tracing",
]
## A traced replacement for `axum::serve` from Axum 0.8.
axum-0-8 = [
    "dep:axum-0-8",
    "dep:axum-core-0-5",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tokio",
    "dep:tower",
    "dep:tower-service",
    "dep:tracing",
]

[dev-dependencies]
tokio = { version = "1.52.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "io-util",
    "net",
    "sync",
    "time",
    "test-util",
] }
