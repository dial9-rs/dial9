[workspace]
git_release_enable = true
changelog_update = false
semver_check = true
# Release-PR branch prefix for this maintenance branch.
#
# Two constraints:
#   1. The slash matters: `release-plz-<timestamp>` (no slash) matches the
#      `release-*` branch-protection rulesets (incl. the admins-only creation
#      restriction) and gets rejected. GitHub's `release-*` glob does not cross
#      `/`, so a `.../` form is exempt.
#   2. It must NOT share a prefix with main's `release-plz/`. release-plz treats
#      any open PR matching its configured prefix as its own and closes the
#      "stale" ones — so if main and release-0.3.x share a prefix, a release-pr
#      run on main will close release-0.3.x's release PR (and vice versa).
#      A distinct `release-plz-0.3/` keeps the two release lines isolated.
pr_branch_prefix = "release-plz-0.3/"
pr_body = """
{% for release in releases %}
{% if release.title %}
### {{release.title}}
{% endif %}
Package: `{{release.package}}` {{release.previous_version}} -> {{release.next_version}}
{% if release.changelog %}
Changes:
{{release.changelog}}
{% endif %}
{% endfor %}
---

> **Maintainer note:** CI does not trigger automatically on this PR (GitHub limitation with `GITHUB_TOKEN`-created PRs). **Close and reopen** this PR to trigger CI before merging.
"""

[[package]]
name = "dial9-tokio-telemetry"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
    "dial9-macro",
    "dial9-perf-self-profile",
    "dial9-trace-format",
    "dial9-trace-format-derive",
    "dial9-viewer",
    "dial9",
]

[[package]]
name = "dial9-macro"
changelog_update = false

[[package]]
name = "dial9-perf-self-profile"
changelog_update = false

[[package]]
name = "dial9-trace-format"
changelog_update = false
version_group = "trace-format"

[[package]]
name = "dial9-trace-format-derive"
changelog_update = false
version_group = "trace-format"

[[package]]
name = "dial9-viewer"
changelog_update = false

[[package]]
name = "dial9"
changelog_update = false
