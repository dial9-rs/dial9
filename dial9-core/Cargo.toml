[package]
name = "dial9-core"
version = "0.4.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Telemetry event bus for dial9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }

[dependencies]
crossbeam-queue = "0.3"
dial9-trace-format = { workspace = true }
libc = { workspace = true }
metrique = { version = "0.1.23", features = ["local-format"] }
shuttle = { version = "0.9.1", optional = true }
tracing = "0.1.44"

[dev-dependencies]
proptest = "1"

[features]
_shuttle = ["dep:shuttle"]
