[package]
name = "dial9-core"
version = "0.4.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Telemetry event bus for dial9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }

[dependencies]
bon = "3"
bytes = "1"
crossbeam-queue = "0.3"
dial9-trace-format = { workspace = true }
event-listener = "5"
libc = { workspace = true }
metrique = { version = "0.1.23", features = ["local-format"] }
metrique-timesource = "0.1"
shuttle = { version = "0.9.1", optional = true }
tracing = "0.1.44"

[dev-dependencies]
assert2 = { workspace = true }
metrique-timesource = { version = "0.1", features = [
    "custom-timesource",
    "tokio",
] }
proptest = "1"
tempfile = "3"
tokio = { version = "1.52.0", features = ["rt", "macros", "time", "test-util"] }

[features]
_shuttle = ["dep:shuttle"]
