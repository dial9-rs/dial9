[package]
name = "dial9-min-versions-tests"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false

# Test the production consumer graph independently of workspace dev-dependencies.
[workspace]
resolver = "3"

[profile.release]
debug = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)", "cfg(shuttle)", 'cfg(feature, values("taskdump"))'] }

# Match the feature gates in the reused test sources. The dependencies below
# enable the corresponding production features without task dumps or the CLI.
[features]
default = ["tokio", "pipeline", "analysis", "cpu-profiling", "memory-profiling", "process-resource", "linux-socket", "worker-s3", "unstable-events", "metrique-sink"]
tokio = []
pipeline = []
analysis = []
cpu-profiling = []
memory-profiling = []
process-resource = []
linux-socket = []
worker-s3 = []
unstable-events = []
metrique-sink = []

[dependencies]
tokio = { version = "=1.51.0", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
dial9 = { path = "../../dial9", default-features = false, features = ["tokio", "analysis", "cpu-profiling", "memory-profiling", "process-resource", "linux-socket", "worker-s3", "metrique-sink", "unstable-events"] }
dial9-tokio-telemetry = { path = "../../dial9-tokio-telemetry", features = ["analysis", "cpu-profiling", "memory-profiling", "process-resource", "linux-socket", "worker-s3", "unstable-events"] }
dial9-core = { path = "../../dial9-core", features = ["pipeline", "test-util"] }
dial9-destinations-s3 = { path = "../../dial9-destinations-s3" }
dial9-perf-self-profile = { path = "../../perf-self-profile", features = ["cpu-profiling", "test-util", "unstable-events"] }
dial9-trace-format = { path = "../../dial9-trace-format", features = ["serde-deserialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
flate2 = "1"
libc = "0.2"
nix = { version = "0.29", features = ["process"] }
proptest = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrique = { version = "0.1.29", features = ["local-format"] }
metrique-writer = { version = "0.1", features = ["test-util"] }
metrique-timesource = { version = "0.1", features = ["custom-timesource", "tokio", "test-util"] }

