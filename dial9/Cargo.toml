[package]
name = "dial9"
version = "0.5.0-rc2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Low-overhead async runtime telemetry: event recording, Tokio integration, CPU/memory profiling, and a trace viewer CLI"
keywords = ["tokio", "telemetry", "profiling", "tracing"]
categories = ["asynchronous", "development-tools::profiling"]

[package.metadata.docs.rs]
all-features = true
# `--all-features` turns on `taskdump`, which requires `--cfg tokio_unstable`.
rustdoc-args = ["--cfg", "tokio_unstable"]
rustc-args = ["--cfg", "tokio_unstable", "-C", "force-frame-pointers=yes"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/dial9-viewer-v{ version }/dial9-viewer-{ target }-v{ version }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "dial9{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "dial9"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "cli_trace_shape"
required-features = ["cli"]

[lints.rust]
missing_debug_implementations = "warn"

[dependencies]
dial9-core = { workspace = true }
dial9-trace-format = { workspace = true }
dial9-perf-self-profile = { workspace = true, optional = true }
dial9-tokio-telemetry = { workspace = true, optional = true }
dial9-destinations-s3 = { workspace = true, optional = true }
dial9-macro = { workspace = true, optional = true }
dial9-metrique = { workspace = true, optional = true }

dial9-viewer = { workspace = true, optional = true, default-features = false }
anyhow = { version = "1", optional = true }

tokio = { version = "1.52.0", optional = true, default-features = false, features = [
    "rt",
    "rt-multi-thread",
] }
bon = { version = "3", optional = true }
tracing = { version = "0.1.44", optional = true }

[features]
default = []

## The `dial9` viewer/analysis binary (`dial9 serve`, `dial9 agents`) with S3.
## This preserves the existing `cargo install dial9 --features cli` behavior.
## For a local-only viewer without the AWS SDK, use the `dial9-viewer` crate
## directly with its default features disabled.
cli = ["dep:dial9-viewer", "dep:anyhow", "dial9-viewer/s3"]

## Opt-in self-instrumentation for the `dial9` CLI.
## Activate recording with `DIAL9_ENABLED=true`.
self-telemetry = ["tokio", "cpu-profiling"]

## Background segment-processing pipeline (worker, processors, on-demand dumps).
## Pulls a Tokio runtime for the worker, but not the runtime *integration*.
## The `?/` forward enables perf's symbolize processor only when a perf source
## (e.g. `cpu-profiling`) is already present, so the `SymbolizeProcessor`
## re-export exists exactly when both `pipeline` and `cpu-profiling` are on.
pipeline = [
    "dial9-core/pipeline",
    "dial9-perf-self-profile?/symbolize-processor",
]

## Tokio runtime integration: `#[dial9::main]`, `Recorder::attach_tokio`,
## `spawn` / `spawn_in`, `Dial9TokioHandle`, and the Tokio event sources.
tokio = [
    "dep:dial9-tokio-telemetry",
    "dep:dial9-macro",
    "dep:tokio",
    "dep:bon",
    "dep:tracing",
    "pipeline",
    "dial9-metrique?/tokio",
]

## CPU and scheduler profiling as a standalone `Source`. Auto-wires into the Tokio
## runtime when the `tokio` feature is also on.
cpu-profiling = [
    "dep:dial9-perf-self-profile",
    "dial9-perf-self-profile/cpu-profiling",
    "dial9-tokio-telemetry?/cpu-profiling",
]

## Sampled memory allocation profiling as a standalone `Source`.
memory-profiling = [
    "dep:dial9-perf-self-profile",
    "dial9-perf-self-profile/memory-profiling",
    "dial9-tokio-telemetry?/memory-profiling",
]

## Process resource usage (`getrusage`) as a standalone `Source` (unix).
## Auto-wires into the Tokio runtime when the `tokio` feature is also on.
process-resource = [
    "dep:dial9-perf-self-profile",
    "dial9-perf-self-profile/process-resource",
    "dial9-tokio-telemetry?/process-resource",
]

## Removes `#[non_exhaustive]` from profiling event structs. Unstable.
unstable-events = ["dial9-perf-self-profile?/unstable-events"]

## Metrique sink recording unit-of-work metric entries into dial9 traces.
## Standalone; combine with the `tokio` feature to capture task ids.
metrique-sink = ["dep:dial9-metrique"]

## Serde deserialization of decoded events (`RawEvent::deserialize`).
## Reading a trace with [`Decoder`] needs no feature.
deserialize = ["dial9-trace-format/serde-deserialize"]

## Trace file reading + analysis toolkit (offline decode).
analysis = ["deserialize", "tokio", "dial9-tokio-telemetry/analysis"]

## S3 upload pipeline stage.
worker-s3 = ["tokio", "dep:dial9-destinations-s3", "dial9-tokio-telemetry/worker-s3"]

## Async backtraces at Tokio yield points (Linux only).
taskdump = ["tokio", "dial9-tokio-telemetry/taskdump"]

## TCP accept-queue depth sampling as a standalone `Source` (Linux only).
## Auto-wires into the Tokio runtime when the `tokio` feature is also on.
linux-socket = [
    "dep:dial9-perf-self-profile",
    "dial9-perf-self-profile/linux-socket",
    "dial9-tokio-telemetry?/linux-socket",
]

[dev-dependencies]
dial9 = { path = ".", features = [
    "tokio",
    "analysis",
    "cpu-profiling",
    "memory-profiling",
    "process-resource",
    "linux-socket",
    "metrique-sink",
    "unstable-events",
    "worker-s3",
] }
dial9-core = { workspace = true }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "test-util",
] }
tempfile = "3"
flate2 = "1"
clap = { version = "4", features = ["derive", "env"] }
metrique = { version = "0.1.29", features = ["local-format"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hostname = "0.4"
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "http-1x",
    "rt-tokio",
    "sigv4a",
] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
dial9-trace-format = { workspace = true, features = ["serde-deserialize"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dial9 = { path = ".", features = [
    "tokio",
    "cpu-profiling",
    "memory-profiling",
    "worker-s3",
    "analysis",
    "taskdump",
    "linux-socket",
] }

