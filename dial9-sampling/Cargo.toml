[package]
name = "dial9-sampling"
version = "0.5.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sticky startup profiling admission through pluggable object storage"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:dial9-destinations-s3"]
dial9 = ["dep:dial9-core"]

[dependencies]
bon = "3"
dial9-core = { workspace = true, optional = true }
dial9-destinations-s3 = { workspace = true, optional = true }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt-multi-thread", "net", "macros"] }
tokio-util = "0.7"
tracing = "0.1"
ulid = "1"

aws-sdk-s3 = { version = "1.145", optional = true, default-features = false, features = ["behavior-version-latest", "sigv4a", "rt-tokio", "default-https-client"] }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }

[dev-dependencies]
dial9 = { path = "../dial9", default-features = false, features = ["tokio"] }
dial9-tokio-telemetry = { workspace = true, features = ["_shuttle"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
dial9-core = { workspace = true, features = ["_shuttle"] }
tokio = { version = "1", features = ["macros", "test-util", "rt-multi-thread"] }
rstest = "0.26"
shuttle = "0.9.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(shuttle)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
exit = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
