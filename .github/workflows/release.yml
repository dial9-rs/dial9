name: Publish release

permissions:
  pull-requests: write
  contents: write
  id-token: write

# Single, parameterized publish workflow. It always runs from `main` (so the
# release logic has one source of truth and can't drift per release branch) and
# releases whichever branch is passed in `release_branch`. The input is
# required with no default, so publishing is always a deliberate choice of
# branch (e.g. `main` or `release-0.3.x`).
#
# NOTE: because every run is dispatched against `main`, the `release`
# environment's branch policy can no longer distinguish which branch is being
# released — the "only main or release-* may publish" control lives in the
# `validate-branch` job below. The `dial9-maintainers` approval on the `release`
# environment still gates every publish regardless of input.
on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Branch to release (main or a release-* branch)"
        required: true
        type: string

jobs:
  validate-branch:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Ensure input is a releasable branch
        env:
          RELEASE_BRANCH: ${{ inputs.release_branch }}
        run: |
          case "$RELEASE_BRANCH" in
            main | release-*)
              echo "Releasing from '$RELEASE_BRANCH'." ;;
            *)
              echo "Refusing to release: '$RELEASE_BRANCH' is not 'main' or a 'release-*' branch." >&2
              exit 1 ;;
          esac

  release-plz-release:
    name: Release-plz release
    needs: validate-branch
    runs-on: ubuntu-latest
    environment: release
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.release_branch }}
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dial9-viewer/ui/package-lock.json
      # Build the viewer UI BEFORE release-plz publishes: the dial9-viewer
      # crate archive must carry ui/dist (embedded via rust-embed at compile
      # time), so cargo-install users never need Node.
      - name: Build viewer UI
        working-directory: dial9-viewer/ui
        run: npm ci && npm run build
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1
        id: auth
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@7419a2cb1535b9c0e852b4dec626967baf65c022 # v0.5.102
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Extract the dial9-viewer tag from release-plz's output, then hand off to the
  # binary-build workflow.
  resolve-release:
    name: Resolve release tag
    needs: release-plz-release
    if: >-
      needs.release-plz-release.outputs.releases_created == 'true' &&
      contains(needs.release-plz-release.outputs.releases, '"package_name":"dial9-viewer"')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine tag
        id: version
        shell: bash
        env:
          RELEASES: ${{ needs.release-plz-release.outputs.releases }}
        run: |
          TAG=$(jq -r '.[] | select(.package_name == "dial9-viewer") | .tag' <<<"$RELEASES")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  build-viewer-binaries:
    needs: resolve-release
    uses: ./.github/workflows/build-viewer-binaries.yml
    with:
      tag: ${{ needs.resolve-release.outputs.tag }}
