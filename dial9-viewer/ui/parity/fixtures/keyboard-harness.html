<!doctype html>
<!-- a11y harness: mounts the unified keyboard model's two overlay
     components (lib/interact palette + help overlay) OPEN, so the axe
     scan can audit them. The palette has no landing-time page mount in
     chunk 1 (its page wiring is the chunk-2 viewer), so it cannot
     be scanned on a live page yet; this harness renders the REAL
     component code (imported from src/, transformed by the Vite dev
     server that parity/axe-keyboard.mjs spins up) - never a replica
     that could drift. NOT a build entry: this file must stay out of
     vite.config.ts rollup inputs (dist/ is embedded wholesale into the
     release binary). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>keyboard components a11y harness</title>
  <style>
    body { background: #1a1a2e; color: #e0e0e0; font-family: monospace; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:1em;padding:12px">keyboard harness (palette + help overlay, both open)</h1>
  </main>
  <script type="module">
    import {
      createHelpOverlay,
      createSearchPalette,
    } from "/src/lib/interact/index.ts";

    // The canonical mock's dataset (docs/ui-inventory/mocks/keyboard.html).
    const ITEMS = [
      { kind: "task", label: "0x3a axum_traced.rs:243:33", detail: "+0.31s" },
      { kind: "task", label: "0x51 hyper::proto conn", detail: "+0.02s" },
      { kind: "poi", label: "sched delay 84ms W1", detail: "+1.72s" },
      { kind: "poi", label: "long poll 61ms W0", detail: "+2.03s" },
      { kind: "span", label: "handle_request", detail: "+1.10s" },
      { kind: "span", label: "db_query users", detail: "+1.31s" },
    ];

    const palette = createSearchPalette(document, {
      onActivate: () => {},
    });
    palette.open(ITEMS);

    const help = createHelpOverlay(document, {
      title: "Harness - keyboard",
      sections: [
        {
          title: "Keyboard",
          rows: [
            { keys: "/", text: "search palette" },
            { keys: "?", text: "toggle this help" },
          ],
        },
      ],
    });
    help.open();

    // Signal readiness for the scan script.
    window.__d9HarnessReady = true;
  </script>
</body>
</html>
