<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dial9 embed</title>
<link rel="stylesheet" href="flamegraph.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
#container { width: 100%; height: 100%; display: none; flex-direction: column; }
#loading { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; color: #888; }
#error { display: none; align-items: center; justify-content: center; width: 100%; height: 100%; color: #ff6b6b; padding: 12px; text-align: center; }
#fg-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.timeline-lane { position: relative; width: 100%; }
.timeline-lane canvas { display: block; width: 100%; }
</style>
</head>
<body>
<div id="container"></div>
<div id="loading">Loading&hellip;</div>
<div id="error"></div>

<script src="decode.js"></script>
<script src="trace_parser.js"></script>
<script src="trace_analysis.js"></script>
<script src="flamegraph.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(window.location.search);
  const traceUrl = params.get("trace");
  const view = params.get("view");
  const startNs = params.get("start") != null ? Number(params.get("start")) : null;
  const endNs = params.get("end") != null ? Number(params.get("end")) : null;
  const height = params.get("height") != null ? Number(params.get("height")) : null;

  const loadingEl = document.getElementById("loading");
  const errorEl = document.getElementById("error");
  const containerEl = document.getElementById("container");

  function showError(msg) {
    loadingEl.style.display = "none";
    errorEl.style.display = "flex";
    errorEl.textContent = msg;
  }

  if (!traceUrl) { showError("Missing ?trace= parameter"); return; }
  if (!view || (view !== "flamegraph" && view !== "timeline")) {
    showError("Missing or invalid ?view= parameter (flamegraph|timeline)");
    return;
  }

  // Set height
  const defaultH = view === "flamegraph" ? 320 : 180;
  const h = height || defaultH;
  document.body.style.height = h + "px";

  // Fetch trace
  let buffer;
  try {
    loadingEl.textContent = "Fetching\u2026";
    const resp = await fetch(traceUrl);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    buffer = await resp.arrayBuffer();
  } catch (err) {
    const isFileUrl = window.location.protocol === "file:";
    const hint = isFileUrl
      ? " (browsers block fetch() over file://. Run `dial9 report serve <report-dir>` and open the report via http://localhost.)"
      : "";
    showError("Failed to fetch trace: " + err.message + hint);
    return;
  }

  // Parse
  let trace;
  try {
    loadingEl.textContent = "Parsing\u2026";
    const opts = {};
    if (startNs != null) opts.startTime = startNs;
    if (endNs != null) opts.endTime = endNs;
    trace = await TraceParser.parseTrace(buffer, opts);
  } catch (err) {
    showError("Failed to parse: " + err.message);
    return;
  }

  const ET = TraceParser.EVENT_TYPES;
  const evts = trace.events;
  const wSet = new Set();
  evts.forEach(e => { if (e.eventType !== ET.QueueSample && e.eventType !== ET.WakeEvent) wSet.add(e.workerId); });
  const workerIds = [...wSet].sort((a, b) => a - b);
  const maxTs = evts.length > 0 ? evts[evts.length - 1].timestamp : 0;
  const minTs = evts.length > 0 ? evts[0].timestamp : 0;

  // Build worker spans
  let workerSpans;
  try {
    const spanResult = TraceAnalysis.buildWorkerSpans(evts, workerIds, maxTs, trace.blockInPlaceGaps);
    workerSpans = spanResult.workerSpans;
    if (trace.cpuSamples.length > 0) {
      TraceAnalysis.attachCpuSamples(trace.cpuSamples, workerSpans);
    }
  } catch (err) {
    console.warn("Failed to build worker spans:", err);
  }

  loadingEl.style.display = "none";
  containerEl.style.display = "flex";

  if (view === "flamegraph") {
    renderFlamegraph();
  } else {
    renderTimeline();
  }

  function renderFlamegraph() {
    const fgContainer = document.createElement("div");
    fgContainer.id = "fg-container";
    containerEl.appendChild(fgContainer);

    let samples = FlamegraphRenderer.filterCpuSamples(trace.cpuSamples, startNs, endNs);
    if (samples.length === 0) {
      samples = FlamegraphRenderer.filterCpuSamples(trace.cpuSamples, null, null);
    }
    if (samples.length === 0) {
      showError("No CPU samples in the specified range");
      return;
    }

    const fg = FlamegraphRenderer.createFlamegraph(fgContainer, () => {});
    fg.setData(samples, trace.callframeSymbols);
    window.addEventListener("resize", () => fg.resize());
  }

  function renderTimeline() {
    const viewStart = minTs;
    const viewEnd = maxTs;
    const laneH = Math.max(30, Math.floor((h - 4) / Math.max(workerIds.length, 1)));

    function nsToX(ns, drawW) {
      return ((ns - viewStart) / (viewEnd - viewStart)) * drawW;
    }

    function findFirst(spans, target) {
      let lo = 0, hi = spans.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (spans[mid].end < target) lo = mid + 1;
        else hi = mid - 1;
      }
      return lo;
    }

    for (const wid of workerIds) {
      const lane = document.createElement("div");
      lane.className = "timeline-lane";
      const canvas = document.createElement("canvas");
      lane.appendChild(canvas);
      containerEl.appendChild(lane);

      const dpr = window.devicePixelRatio || 1;
      const pw = containerEl.clientWidth;
      canvas.width = pw * dpr;
      canvas.height = laneH * dpr;
      canvas.style.width = pw + "px";
      canvas.style.height = laneH + "px";
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const spans = workerSpans[wid];
      if (!spans) continue;

      // Background
      ctx.fillStyle = "#1a1e2a";
      ctx.fillRect(0, 0, pw, laneH);

      // Parks
      const parkStart = findFirst(spans.parks, viewStart);
      for (let i = parkStart; i < spans.parks.length; i++) {
        const s = spans.parks[i];
        if (s.start > viewEnd) break;
        const x1 = Math.max(0, nsToX(s.start, pw));
        const x2 = Math.min(pw, nsToX(s.end, pw));
        ctx.fillStyle = "#2a1520";
        ctx.fillRect(x1, 0, Math.max(x2 - x1, 1), laneH);
        ctx.fillStyle = "#cc5533";
        ctx.fillRect(x1, 0, Math.max(x2 - x1, 1), 3);
      }

      // Polls
      const bandTop = Math.floor(laneH * 0.15);
      const bandH = Math.floor(laneH * 0.7);
      const pollStart = findFirst(spans.polls, viewStart);
      for (let i = pollStart; i < spans.polls.length; i++) {
        const s = spans.polls[i];
        if (s.start > viewEnd) break;
        const x1 = Math.max(0, nsToX(s.start, pw));
        const x2 = Math.min(pw, nsToX(s.end, pw));
        ctx.fillStyle = TraceAnalysis.pollHeatmapColorQuantized(s.end - s.start);
        ctx.fillRect(x1, bandTop, Math.max(x2 - x1, 1), bandH);
      }
    }
  }
})();
</script>
</body>
</html>
