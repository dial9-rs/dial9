<!doctype html>
<!-- The migrated trace-viewer page: the Vite entry served at
     /new/viewer.html (the new-UI path; the canonical /viewer.html keeps
     serving the legacy page until removal - ADR-0004 section 8). ALL script
     lives in the module entry (src/pages/viewer/main.ts) except ui-switch.js,
     the same plain copied file both UI generations load. The shell renders
     into #app; landmarks + labels come from the shell template. -->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>dial9 Trace Viewer</title>
        <!-- Off-root new-UI entry: resolve root-relative asset/nav targets
             (/demo-trace.bin, /ui-switch.js) against the server root. -->
        <base href="/" />
        <!-- Dual-UI switch: the auto-boot is a no-op on this off-root
             path; src/pages/viewer/main.ts calls D9UiSwitch.mount({side:"new"}). -->
        <script src="/ui-switch.js"></script>
        <!-- Frozen flamegraph widget styles: the in-viewer region
             analysis (Stack tab) embeds flamegraph.js, which renders `.fg-*`
             chrome; the same copied stylesheet both other generations load. -->
        <link rel="stylesheet" href="/flamegraph.css" />
        <script type="module" src="/src/pages/viewer/main.ts"></script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
