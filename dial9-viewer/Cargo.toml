[package]
name = "dial9-viewer"
version = "0.5.0-rc2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI trace viewer and S3 browser for dial9-tokio-telemetry"
default-run = "dial9-viewer"
# The published crate must carry the BUILT viewer UI: rust-embed embeds
# ui/dist/ at compile time, and release CI runs `npm ci && npm run build`
# before publishing (.github/workflows/release.yml), so cargo-install users
# never need Node (ADR-0004 section 3, constraint H1). ui/dist/* is
# gitignored, and without an explicit `include` cargo drops gitignored files
# from the package - so this list is load-bearing. It also keeps UI sources,
# test_*.js, node_modules, design/, and benchmarks/ out of the archive.
# src/bin/dev_server.rs stays unpublished (dev-only bin, as before).
include = [
    "/build.rs",
    "/src/**",
    "!/src/bin/dev_server.rs",
    "!/src/bin/gen_fixtures.rs",
    "/benches/**",
    "/skills/**",
    "/README.md",
    "/skill-source.md",
    "/tracing-layer-skill-source.md",
    "/ui/dist/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"

[features]
default = ["s3"]
## S3 storage, bring-your-own AWS credentials, and assume-role support.
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
dev-server = ["s3", "dep:s3s", "dep:s3s-fs", "dep:s3s-aws", "dep:tempfile"]

[[bin]]
name = "dial9-viewer"
path = "src/main.rs"

[[bin]]
name = "dev-server"
path = "src/bin/dev_server.rs"
required-features = ["dev-server"]

# T42 test infrastructure: synthetic trace fixture generator (see the file's
# module docs and ui/README.md "Parity gate tooling"). Gated behind the
# dev-server feature and excluded from the published package, like dev-server.
[[bin]]
name = "gen-fixtures"
path = "src/bin/gen_fixtures.rs"
required-features = ["dev-server"]

[[test]]
name = "aggregate_test"
required-features = ["s3"]

[[test]]
name = "server_test"
required-features = ["s3"]

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["query"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "timeout"] }
uuid = { version = "1", features = ["v4"] }
form_urlencoded = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Per-request operational metrics. `emf` emits CloudWatch EMF to stdout in
# production; `local-format` renders a human-readable variant under `--local`.
metrique = { version = "0.1.28", features = ["emf", "local-format"] }
metrique-writer = "0.1"
time = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio", "sigv4a"], optional = true }
anyhow = "1"
bon = "3"
s3s = { version = "0.14.1", optional = true }
s3s-fs = { version = "0.14.1", optional = true }
s3s-aws = { version = "0.14.1", optional = true }
tempfile = { version = "3", optional = true }

# Aggregator dependencies
dial9-trace-format = { workspace = true, features = ["serde-deserialize"] }
arrow = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "flate2", "snap"] }
blake3 = "1"
lasso = "0.7"
rustc-hash = "2"
dial9-core.workspace = true
hex = "0.4"
urlencoding = "2"

[dev-dependencies]
assert2 = { workspace = true }
metrique = { version = "0.1.28", features = ["emf", "local-format", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
s3s = "0.14.1"
s3s-fs = "0.14.1"
s3s-aws = "0.14.1"
tempfile = "3"
aws-smithy-http-client = { version = "1", features = ["test-util"] }
aws-smithy-types = "1"
aws-smithy-async = { version = "1", features = ["rt-tokio"] }
http = "1"

criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "decode_bench"
harness = false

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
