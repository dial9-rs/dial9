[package]
name = "dial9-metrique"
version = "0.5.0-rc2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metrique sink for dial9: records unit-of-work metric entries into the dial9 trace"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dial9-core = { workspace = true }
dial9-trace-format = { workspace = true }
metrique = "0.1.29"
metrique-writer = "0.1.25"
tracing = "0.1.44"
tokio = { version = "1.52.0", optional = true, default-features = false, features = [
    "rt",
] }

[features]
## Capture the tokio task id in `Dial9Context` when the calling thread is
## inside a tokio task. Without this feature the context records thread id
## and timestamps only.
tokio = ["dep:tokio"]

[dev-dependencies]
dial9-core = { workspace = true, features = ["test-util"] }
dial9-metrique = { path = ".", features = ["tokio"] }
dial9-tokio-telemetry = { path = "../dial9-tokio-telemetry" }
dial9-trace-format = { workspace = true, features = ["serde-deserialize"] }
criterion = { version = "0.7", default-features = false }
metrique-writer = { version = "0.1.25", features = ["test-util"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1.52.0", features = ["rt", "rt-multi-thread", "macros"] }

[[bench]]
name = "metrique_sink_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }
