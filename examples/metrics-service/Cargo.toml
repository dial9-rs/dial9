[package]
name = "metrics-service"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
tokio = { version = "1.51.0", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dial9 = { path = "../../dial9", default-features = false, features = ["tokio", "worker-s3", "tracing-layer", "metrique-sink", "memory-profiling", "process-resource", "cpu-profiling", "linux-socket"] }
dial9-utils = { path = "../../dial9-utils", features = ["axum-08"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
hostname = "0.4"
libc = "0.2"
metrique = { version = "0.1.29", features = ["local-format"] }
metrique-writer = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
dial9 = { path = "../../dial9", default-features = false, features = ["tokio", "cpu-profiling", "worker-s3", "tracing-layer", "metrique-sink", "taskdump", "memory-profiling", "linux-socket"] }
