[package]
name = "cuda-profiling"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "cublas", "dynamic-loading", "cuda-12000"] }
dial9 = { path = "../../dial9", default-features = false }
dial9-perf-self-profile = { path="../../perf-self-profile", default-features=false, features = ["cuda"] }
