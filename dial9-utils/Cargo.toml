[package]
name = "dial9-utils"
version = "0.4.0-alpha.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Supporting utilities for dial9: S3 segment upload, and the runtime-agnostic metrique trace-integration engine"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }

[dependencies]
dial9-core = { workspace = true, features = ["pipeline"] }
bon = "3"
tokio = { version = "1", features = ["fs"], default-features = false }
tracing = "0.1.44"
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "sigv4a",
    "rt-tokio",
    "default-https-client",
] }
aws-config = { version = "1", default-features = false }
time = { version = "0.3", features = ["formatting", "macros"] }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
metrique = "0.1.23"
dial9-trace-format = { workspace = true }

[features]
## Runtime-agnostic engine that records `Emit`-tagged fields of
## descriptor-aware metrique entries into the dial9 trace. `metrique` is
## already an unconditional dependency of this crate, so this only gates
## compiling the integration module. Runtime-specific context capture (e.g.
## tokio worker/task ids) is layered on top by consuming crates such as
## `dial9-tokio-telemetry`.
metrique-integration = []

[dev-dependencies]
dial9-core = { workspace = true, features = ["pipeline", "test-util"] }
assert2 = { workspace = true }
async-trait = "0.1.89"
flate2 = "1"
tempfile = "3"
tokio = { version = "1.52.0", features = ["rt", "macros", "time", "test-util"] }
s3s = "0.14.1"
s3s-fs = "0.14.1"
s3s-aws = "0.14.1"
