[package]
name = "dial9-utils"
version = "0.5.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in integrations for dial9"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(shuttle)",
    "cfg(iai_enabled)",
] }
missing_debug_implementations = "warn"

[dependencies]
dial9-core = { workspace = true, features = ["pipeline"] }
dial9-trace-format = { workspace = true, optional = true }
pin-project-lite = { version = "0.2", optional = true }
tokio = { version = "1.52.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "registry",
] }
axum-0-7 = { package = "axum", version = "0.7", optional = true }
axum-core-0-4 = { package = "axum-core", version = "0.4", optional = true }
axum-0-8 = { package = "axum", version = "0.8", optional = true }
axum-core-0-5 = { package = "axum-core", version = "0.5", optional = true }
futures-util = { version = "0.3", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
], optional = true }
tower = { version = "0.5", optional = true }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }

[features]
## Tracing-subscriber layer that emits span events into dial9 traces.
tracing-layer = [
    "dep:dial9-trace-format",
    "dep:tracing-subscriber",
    "tokio/rt",
]
## A traced replacement for `axum::serve` from Axum 0.7.
axum-07 = [
    "dep:dial9-trace-format",
    "dep:axum-0-7",
    "dep:axum-core-0-4",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/sync",
    "dep:tower",
    "dep:tower-service",
]
## A traced replacement for `axum::serve` from Axum 0.8.
axum-08 = [
    "dep:dial9-trace-format",
    "dep:axum-0-8",
    "dep:axum-core-0-5",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/sync",
    "dep:tower",
    "dep:tower-service",
]
## Ad-hoc span wrappers (`span` module: the `dial9_span!` macro, the future
## combinator, and the sync guard). `tokio/rt` provides the optional current
## task id used to correlate spans with Tokio poll events.
span = ["dep:dial9-trace-format", "dep:pin-project-lite", "tokio/rt"]
## Tower middleware for ad-hoc spans (`span::Dial9SpanLayer`). Implies `span`.
tower = ["span", "dep:tower-service", "dep:tower-layer"]

[dev-dependencies]
# The `adhoc_spans` example sets its runtime up through the `dial9` facade, the
# way a user would. Nothing in the `dial9` tree depends on `dial9-utils`, so
# this is not a cycle.
dial9 = { path = "../dial9", features = ["tokio"] }
dial9-core = { workspace = true, features = ["pipeline"] }
dial9-tokio-telemetry = { workspace = true }
dial9-trace-format = { workspace = true, features = ["serde-deserialize"] }
dial9-utils = { path = ".", features = ["tracing-layer"] }
criterion = "0.5"
iai-callgrind = "=0.16.1"
tempfile = "3"
tokio = { version = "1.52.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }

[[example]]
name = "adhoc_spans"
required-features = ["span"]

[[bench]]
name = "span_encode_bench"
harness = false
required-features = ["span"]

[[bench]]
name = "tracing_layer_bench"
harness = false
required-features = ["tracing-layer"]

[[bench]]
name = "tracing_layer_iai"
harness = false
required-features = ["tracing-layer"]

[[example]]
name = "tracing_sleep"
required-features = ["tracing-layer"]
