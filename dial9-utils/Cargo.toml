[package]
name = "dial9-utils"
version = "0.5.0-rc0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in integrations for dial9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(shuttle)"] }
missing_debug_implementations = "warn"

[dependencies]
dial9-core = { workspace = true, features = ["pipeline"] }
dial9-trace-format = { workspace = true, optional = true }
pin-project-lite = "0.2"
# `rt` is needed for `tokio::runtime::worker_index()` (the span `worker_id`).
tokio = { version = "1", features = [
    "rt",
], default-features = false, optional = true }
tracing = "0.1.44"
axum-0-7 = { package = "axum", version = "0.7", optional = true }
axum-core-0-4 = { package = "axum-core", version = "0.4", optional = true }
axum-0-8 = { package = "axum", version = "0.8", optional = true }
axum-core-0-5 = { package = "axum-core", version = "0.5", optional = true }
futures-util = { version = "0.3", optional = true }
hyper = { version = "1", optional = true }
hyper-util = { version = "0.1", features = [
    "tokio",
    "server-auto",
], optional = true }
tower = { version = "0.5", optional = true }
tower-service = { version = "0.3", optional = true }
tower-layer = { version = "0.3", optional = true }

[features]
## A traced replacement for `axum::serve` from Axum 0.7.
axum-07 = [
    "dep:dial9-trace-format",
    "dep:axum-0-7",
    "dep:axum-core-0-4",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/sync",
    "dep:tower",
    "dep:tower-service",
]
## A traced replacement for `axum::serve` from Axum 0.8.
axum-08 = [
    "dep:dial9-trace-format",
    "dep:axum-0-8",
    "dep:axum-core-0-5",
    "dep:futures-util",
    "dep:hyper",
    "dep:hyper-util",
    "tokio/net",
    "tokio/sync",
    "dep:tower",
    "dep:tower-service",
]
## Ad-hoc span wrappers (`span` module: the `dial9_span!` macro, the future
## combinator, and the sync guard). Independent of any async runtime.
span = ["dep:dial9-trace-format", "dep:tokio"]
## Tower middleware for ad-hoc spans (`span::Dial9SpanLayer`). Implies `span`.
tower = ["span", "dep:tower-service", "dep:tower-layer"]

[dev-dependencies]
dial9-core = { workspace = true, features = ["pipeline"] }
dial9-trace-format = { workspace = true, features = ["serde-deserialize"] }
criterion = "0.5"
tempfile = "3"
tokio = { version = "1.52.0", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
] }

[[example]]
name = "adhoc_spans"
required-features = ["span"]

[[bench]]
name = "span_encode_bench"
harness = false
required-features = ["span"]
